name: Windows installer

on:
  push:
    branches: [ccr-bb5be1e5-146or2, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install . google-genai pytest pyinstaller

      - name: Run the tests on Windows
        run: python -m pytest -q

      - name: Build the app
        run: >
          pyinstaller --noconfirm --console --name "Jag Studio"
          --icon packaging/windows/jagstudio.ico
          --paths . --add-data "jagimage/static;jagimage/static" --collect-submodules google.genai
          packaging/windows/jag_studio.py

      - name: Check the app starts
        shell: pwsh
        run: '& "dist\Jag Studio\Jag Studio.exe" --smoke --no-browser'

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=0.1.${{ github.run_number }}" packaging\windows\installer.iss

      - name: Install it and check the installed app starts
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath "dist\Jag Studio Setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART"
          & "$env:LOCALAPPDATA\Programs\Jag Studio\Jag Studio.exe" --smoke --no-browser

      - uses: actions/upload-artifact@v4
        with:
          name: Jag-Studio-Setup
          path: dist/Jag Studio Setup.exe
